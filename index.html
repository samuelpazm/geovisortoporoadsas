const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
const map=L.map('map',{layers:[osm]}).setView([1.3,-77.4],8);
L.control.layers({'Mapa':osm,'Satélite':sat}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
const cluster=L.markerClusterGroup({chunkedLoading:true}).addTo(map);
const fmt=n=>n.toLocaleString('es-CO',{minimumFractionDigits:3});
const sel=document.getElementById('mun'),q=document.getElementById('q'),info=document.getElementById('info');
[...new Set(PUNTOS.map(p=>p[0]))].sort().forEach(m=>sel.add(new Option(m,m)));

function dibujar(zoom){
  cluster.clearLayers();
  const m=sel.value,t=q.value.trim().toLowerCase(),ms=[];
  PUNTOS.forEach(p=>{
    if((m&&p[0]!==m)||(t&&!p[2].toLowerCase().includes(t)))return;
    const mk=L.marker([p[6],p[7]]);
    mk.bindPopup(`<b>${p[2]}</b><br>Municipio: ${p[0]}<br>Código DANE: ${p[1]??'—'}<br>Identificador: ${p[3]}`);
    ms.push(mk);
  });
  cluster.addLayers(ms);
  info.textContent=ms.length+' puntos';
  if(zoom&&ms.length)map.fitBounds(cluster.getBounds().pad(.1));
}
sel.onchange=()=>dibujar(true);
q.oninput=()=>dibujar(false);
q.onchange=()=>dibujar(true);
dibujar(true);
</script>
