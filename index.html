<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geovisor de puntos de georreferenciación</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--fg:#14213d;--mut:#64748b;--ac:#0f766e;--line:#e2e8f0;--sh:0 10px 34px #0f172a33}
*{box-sizing:border-box}
html,body,#map{height:100%;margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
#side{position:absolute;z-index:1000;top:12px;left:12px;bottom:12px;width:340px;background:#fff;border-radius:18px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s}
#side.off{transform:translateX(-370px)}
header{padding:16px;background:linear-gradient(135deg,#0f766e,#0369a1);color:#fff}
header h1{margin:0;font-size:17px}header p{margin:2px 0 0;opacity:.85;font-size:12px}
.body{overflow:auto;padding:4px 16px 12px;flex:1}
h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#f8fafc;outline:none}
input[type=search]:focus,select:focus{border-color:var(--ac);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;user-select:none;transition:.15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#res{margin-top:6px}
.r{padding:8px 10px;border-radius:10px;cursor:pointer;font-size:12px}
.r:hover{background:#f0fdfa}.r small{color:var(--mut);display:block}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{flex:1;padding:9px;border:0;border-radius:12px;background:#f1f5f9;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{background:#ccfbf1}
footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
#tg{position:absolute;z-index:1001;top:12px;right:12px;width:42px;height:42px;border:0;border-radius:12px;background:#fff;box-shadow:var(--sh);font-size:20px;cursor:pointer}
#coord{position:absolute;z-index:900;bottom:8px;left:50%;transform:translateX(-50%);background:#fffc;padding:3px 10px;border-radius:8px;font-size:11px;pointer-events:none}
.leaflet-popup-content-wrapper{border-radius:14px}
@media(max-width:640px){#side{top:auto;left:8px;right:8px;width:auto;height:58%;bottom:8px}#side.off{transform:translateY(120%)}#coord{display:none}}
</style>
</head>
<body>
<div id="side">
  <header><h1>Geovisor de puntos</h1><p><b id="n">0</b> puntos visibles · <span id="tot"></span> en total</p></header>
  <div class="body">
    <h2>Buscar</h2>
    <input id="q" type="search" placeholder="Nomenclatura o municipio…">
    <div id="res"></div>
    <h2>Ir a un municipio</h2>
    <select id="mun"></select>
    <h2>Tipo de punto</h2><div class="chips" id="tipos"></div>
    <h2>Año de levantamiento</h2><select id="anio"></select>
    <h2>Mapa base</h2><div class="chips" id="bases"></div>
    <h2>Opciones</h2>
    <div class="chips">
      <span class="chip on" id="ck">Agrupar puntos</span>
      <span class="chip" id="lb">Etiquetas sobre satélite</span>
    </div>
  </div>
  <footer>
    <button class="btn" id="todo">Ver todo</button>
    <button class="btn" id="loc">Mi ubicación</button>
    <button class="btn" id="fs">Pantalla completa</button>
  </footer>
</div>
<button id="tg" title="Mostrar u ocultar menú">☰</button>
<div id="map"></div>
<div id="coord"></div>

const NATIVO=17; // Zoom máximo con imagen real del satélite; más allá se amplía sin dejar el mapa en blanco. Súbelo a 18 si tu zona tiene buena cobertura.
const COL={GNSS:'#2563eb',GPS:'#ea580c',PL:'#16a34a',Otro:'#64748b'};
const tipo=i=>{const s=i.toUpperCase();return /^(GNSS|GNNS)/.test(s)?'GNSS':s.startsWith('GPS')?'GPS':s.startsWith('PL')?'PL':'Otro'};
const P=DATA.map(r=>{const y=r[2].match(/_(\d{4})[A-Za-z]*$/);return{m:r[0],d:r[1],n:r[2],i:r[3],lat:r[4],lon:r[5],t:tipo(r[3]),y:y?+y[1]:null}});
const $=id=>document.getElementById(id);
const S={m:'',y:'',t:new Set(Object.keys(COL))};

const tl=(u,o)=>L.tileLayer(u,Object.assign({maxZoom:21,maxNativeZoom:19},o));
const BASES={
 'Satélite':tl('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:NATIVO,attribution:'Esri, Maxar, Earthstar Geographics'}),
 'Satélite nítido':tl('https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:NATIVO,attribution:'Esri Clarity'}),
 'Calles':tl('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}),
 'Relieve':tl('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxNativeZoom:17,attribution:'© OpenTopoMap'}),
 'Oscuro':tl('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',attribution:'© CARTO'})
};
const ETQ=tl('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:16});
const map=L.map('map',{zoomControl:false,maxZoom:21,preferCanvas:true,layers:[BASES['Satélite']]}).setView([1.3,-77.4],8);
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);
let base='Satélite';

// Marcadores
P.forEach(p=>{p.mk=L.circleMarker([p.lat,p.lon],{radius:7,color:'#fff',weight:2,fillColor:COL[p.t],fillOpacity:.95})
 .bindPopup(`<b>${p.n}</b><br>Municipio: ${p.m}<br>Código DANE: ${p.d??'—'}<br>Identificador: ${p.i}`)});
const agr=L.markerClusterGroup({chunkedLoading:true,showCoverageOnHover:false,maxClusterRadius:45});
const sim=L.featureGroup();
let capa=agr,cluster=true;map.addLayer(capa);

const filtrar=()=>{const q=$('q').value.trim().toLowerCase();
 return P.filter(p=>(!S.m||p.m===S.m)&&S.t.has(p.t)&&(!S.y||p.y==S.y)&&(!q||p.n.toLowerCase().includes(q)||p.m.toLowerCase().includes(q)))};
function render(ajustar){
 capa.clearLayers();const f=filtrar(),ms=f.map(p=>p.mk);
 cluster?capa.addLayers(ms):ms.forEach(m=>capa.addLayer(m));
 $('n').textContent=f.length;
 const q=$('q').value.trim();
 $('res').innerHTML=q?f.slice(0,8).map((p,k)=>`<div class="r" data-k="${P.indexOf(p)}"><b>${p.n}</b><small>${p.m} · ${p.i}</small></div>`).join('')||'<div class="r">Sin resultados</div>':'';
 if(ajustar&&f.length)map.flyToBounds(L.latLngBounds(f.map(p=>[p.lat,p.lon])).pad(.15),{maxZoom:16,duration:.8});
}
function ir(p){cluster?capa.zoomToShowLayer(p.mk,()=>p.mk.openPopup()):(map.flyTo([p.lat,p.lon],18),p.mk.openPopup())}

// Controles del menú
const muns=[...new Set(P.map(p=>p.m))].sort((a,b)=>a.localeCompare(b,'es'));
$('mun').innerHTML='<option value="">Todos los municipios ('+muns.length+')</option>'+muns.map(m=>`<option value="${m}">${m} (${P.filter(p=>p.m===m).length})</option>`).join('');
const anios=[...new Set(P.map(p=>p.y).filter(Boolean))].sort();
$('anio').innerHTML='<option value="">Todos los años</option>'+anios.map(a=>`<option>${a}</option>`).join('');
$('tipos').innerHTML=Object.keys(COL).map(t=>`<span class="chip on" data-t="${t}"><i class="dot" style="background:${COL[t]}"></i>${t} (${P.filter(p=>p.t===t).length})</span>`).join('');
$('bases').innerHTML=Object.keys(BASES).map(b=>`<span class="chip${b===base?' on':''}" data-b="${b}">${b}</span>`).join('');
$('tot').textContent=P.length;

$('mun').onchange=e=>{S.m=e.target.value;render(true)};
$('anio').onchange=e=>{S.y=e.target.value;render(true)};
$('q').oninput=()=>render(false);
$('q').onkeydown=e=>{if(e.key==='Enter')render(true)};
$('res').onclick=e=>{const r=e.target.closest('.r');if(r&&r.dataset.k)ir(P[r.dataset.k])};
$('tipos').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;c.classList.toggle('on');
 c.classList.contains('on')?S.t.add(c.dataset.t):S.t.delete(c.dataset.t);render(false)};
$('bases').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
 map.removeLayer(BASES[base]);base=c.dataset.b;BASES[base].addTo(map).bringToBack();
 document.querySelectorAll('#bases .chip').forEach(x=>x.classList.toggle('on',x===c))};
$('ck').onclick=e=>{cluster=!cluster;e.target.classList.toggle('on',cluster);
 map.removeLayer(capa);capa=cluster?agr:sim;map.addLayer(capa);render(false)};
$('lb').onclick=e=>{const on=e.target.classList.toggle('on');on?ETQ.addTo(map):map.removeLayer(ETQ)};
$('todo').onclick=()=>{S.m='';S.y='';$('mun').value='';$('anio').value='';$('q').value='';
 document.querySelectorAll('#tipos .chip').forEach(c=>{c.classList.add('on');S.t.add(c.dataset.t)});render(true)};
$('loc').onclick=()=>map.locate({setView:true,maxZoom:17});
map.on('locationfound',e=>L.circleMarker(e.latlng,{radius:8,color:'#fff',fillColor:'#0ea5e9',fillOpacity:1,weight:3}).addTo(map).bindPopup('Estás aquí').openPopup());
map.on('locationerror',()=>alert('No se pudo obtener tu ubicación. Revisa los permisos del navegador.'));
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('tg').onclick=()=>$('side').classList.toggle('off');
map.on('mousemove',e=>$('coord').textContent=e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5));
if(innerWidth<641)$('side').classList.add('off');
render(false);
map.fitBounds(L.latLngBounds(P.map(p=>[p.lat,p.lon])).pad(.1));
</script>
